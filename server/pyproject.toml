[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-song-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# live: 실제 외부 API(Open-Meteo, Nominatim)를 부르는 테스트. 기본은 건너뛰고 `-m live` 로만 실행
markers = ["live: calls real external APIs (run with -m live)"]
addopts = "-m 'not live'"
